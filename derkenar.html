<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Derkenar / Marginalia — Kübra Tolak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEAE2;
  --ink:#1F1C17;
  --muted:#636057;
  --rule:#CAC5B8;
  --amber:#A8461C;
  --amber-soft:#8C4419;
  --accent:#A8461C;
  --card:#F2F3EE;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#17150F;--ink:#E9E6DD;--muted:#A19C90;--rule:#36322A;
    --amber:#6E2D0F;--amber-soft:#8C4419;--accent:#DD8A4E;--card:#1D201B;
  }
}
:root[data-theme="dark"]{
  --paper:#17150F;--ink:#E9E6DD;--muted:#A19C90;--rule:#36322A;
  --amber:#6E2D0F;--amber-soft:#8C4419;--accent:#DD8A4E;--card:#1D201B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:Spectral,Georgia,"Times New Roman",serif;
  font-weight:300;font-size:1.0625rem;line-height:1.65;
}
.wrap{max-width:62rem;margin:0 auto;padding:0 1.6rem}

/* ---- header ---- */
header{border-bottom:1px solid var(--rule)}
.bar{display:flex;flex-wrap:wrap;gap:1rem 2rem;align-items:baseline;
     justify-content:space-between;padding:1.3rem 0}
.name{font-size:1.15rem;font-weight:600;letter-spacing:.01em}
nav{font-family:Archivo,system-ui,sans-serif;font-size:.85rem;
    display:flex;flex-wrap:wrap;gap:1.4rem}
nav a{color:var(--muted);text-decoration:none;padding-bottom:2px;
      border-bottom:1px solid transparent}
nav a:hover,nav a:focus-visible{color:var(--ink);border-bottom-color:var(--accent)}

/* ---- hero: iki dil yan yana ---- */
.hero{padding:4.5rem 0 3.5rem;border-bottom:1px solid var(--rule)}
.hero h1{font-size:clamp(2.1rem,5.4vw,3.4rem);font-weight:400;line-height:1.12;
         margin:0 0 2.4rem;max-width:18ch;letter-spacing:-.015em}
.bi{display:grid;grid-template-columns:1fr 1fr;gap:2.6rem}
.hero-bi h1,.hero-bi p{font-size:clamp(1.45rem,3vw,2.05rem);font-weight:400;
  line-height:1.28;letter-spacing:-.01em;color:var(--ink);margin:0;max-width:22ch}
.keys{font-family:Archivo,sans-serif;font-size:.85rem;color:var(--accent);
  margin:2.2rem 0 0;letter-spacing:.02em}
.bi p{margin:0;max-width:46ch;color:var(--muted);font-size:1rem}
.bi p:first-child{color:var(--ink)}

/* dil isareti — bilgi tasiyor, sus degil */
.lang{font-family:Archivo,sans-serif;font-size:.7rem;font-weight:600;
      letter-spacing:.09em;color:var(--accent);display:inline-block;
      margin-bottom:.5rem}

/* ---- bolumler ---- */
section{padding:3.4rem 0;border-bottom:1px solid var(--rule)}
section h2{font-size:1.75rem;font-weight:400;margin:.2rem 0 .5rem;letter-spacing:-.01em}
.lede{color:var(--muted);max-width:56ch;margin:0 0 2rem}
.alt{white-space:nowrap}

.items{list-style:none;margin:0;padding:0}
.items li{padding:1rem 0;border-top:1px solid var(--rule)}
.items li:first-child{border-top:0}
.t{display:block}
.meta{font-family:Archivo,sans-serif;font-size:.8rem;color:var(--muted);
      display:block;margin-top:.2rem}
a.link{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
a.link:hover,a.link:focus-visible{border-bottom-color:var(--accent)}

/* ---- seri bandi: tek cesur an ---- */
.series{background:var(--amber);color:#FBF0E2;border-bottom:0}
.series h2,.series .t{color:#FBF0E2}
.series .lede,.series .meta{color:#E0BFA0}
.series .lang{color:#F0B678}
.series .items li{border-top-color:var(--amber-soft)}
.series a.link{color:#FBF0E2;border-bottom-color:var(--amber-soft)}
.series a.link:hover{border-bottom-color:#F0B678}

footer{padding:2.6rem 0 3.4rem;font-family:Archivo,sans-serif;font-size:.85rem;
       color:var(--muted);display:flex;flex-wrap:wrap;gap:.6rem 1.6rem}
footer a{color:var(--muted)}

.note{background:var(--card);border-left:3px solid var(--accent);
      padding:1rem 1.1rem;margin:2rem 0 0;font-size:.92rem;color:var(--muted)}

@media (max-width:640px){
  .bi{grid-template-columns:1fr;gap:1.8rem}
  .hero{padding:3rem 0 2.4rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.note-list{list-style:none;margin:0;padding:0}
.note-item{padding:1.6rem 0;border-top:1px solid var(--rule)}
.note-item:first-child{border-top:0;padding-top:.4rem}
.note-item time{font-family:Archivo,sans-serif;font-size:.8rem;color:var(--accent);
  display:block;margin-bottom:.45rem;letter-spacing:.02em}
.note-item p{margin:0 0 .7rem;max-width:60ch}
.note-item p:last-child{margin-bottom:0}
.back{font-family:Archivo,sans-serif;font-size:.85rem}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="name" href="index.html" style="color:inherit;text-decoration:none">Kübra Tolak</a>
    <nav>
      <a href="index.html#akademik">Akademik</a>
      <a href="index.html#seri">Kurşun Kalem</a>
      <a href="index.html#edebi">Edebî</a>
      <a href="derkenar.html" aria-current="page" style="color:var(--ink)">Derkenar</a>
      <a href="index.html#podcast">Podcast</a>
    </nav>
  </div>
</header>

<main>
  <section class="wrap" style="border-bottom:0">
    <span class="lang">Türkçe</span>
    <h2>Derkenar <span class="alt">/ Marginalia</span></h2>
    <p class="lede">Koşarken, yürürken, arada aklıma düşenler. Kısa notlar.<br>Short notes, mostly written after a run.</p>

    <ol class="note-list" reversed>

      <!-- ========== YENİ NOT: bu bloğu kopyala, hemen altına yapıştır, tarihi ve metni değiştir ==========
      <li class="note-item">
        <time datetime="2026-09-21">21 Eylül 2026</time>
        <p>Notun buraya.</p>
      </li>
      ================================================================================================ -->

      <li class="note-item">
        <time datetime="2026-09-21">21 Eylül 2026</time>
        <p>[İlk notun buraya gelecek.]</p>
      </li>

    </ol>
  </section>
</main>

<footer class="wrap">
  <span><a class="back" href="index.html">← Ana sayfa</a></span>
</footer>

</body>
</html>
